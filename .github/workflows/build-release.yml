name: Build WordPress Plugin Release

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin ZIP
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get plugin version
        id: version
        run: |
          VERSION=$(grep "Version:" plugin.php | awk '{print $3}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Plugin version: $VERSION"
      
      - name: Create plugin directory
        run: |
          mkdir -p parallax-section
          
      - name: Copy plugin files
        run: |
          # Copy main files
          cp plugin.php parallax-section/
          cp readme.txt parallax-section/
          
          # Copy directories
          cp -r build parallax-section/
          cp -r includes parallax-section/
          cp -r languages parallax-section/
      
      - name: Create ZIP archive
        run: |
          zip -r parallax-section-${{ steps.version.outputs.version }}.zip parallax-section/
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: parallax-section-${{ steps.version.outputs.version }}
          path: parallax-section-${{ steps.version.outputs.version }}.zip
          retention-days: 90
      
      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: parallax-section-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
